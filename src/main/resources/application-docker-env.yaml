spring:
  cloud:
    aws:
      secretsmanager:
        enabled: false
      parameterstore:
        enabled: false
  data:
    redis:
      host: algashop-redis
      port: 6379
      password: algashop
      database: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.algashop.local:8081

eureka:
  client:
    serviceUrl:
      defaultZone: http://algashop-service-registry:8761/eureka
